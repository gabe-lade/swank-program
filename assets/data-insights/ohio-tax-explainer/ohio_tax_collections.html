<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>How Much Does Each Ohio County Collect?</title>

<!-- County choropleth of local tax collections — switch tax type and toggle
     per-resident. Self-contained except Leaflet (CDN) and the baked county
     data in ./data/county_collections.js. Sibling to who_taxes_you.html and
     authority_tax_maps.html. Each tax is a DIFFERENT base (see the note
     in-panel); these are county totals, not one government's take.
     Layout: the switcher/readout/legend panel docks BESIDE the map (below
     it under 720px) and can be minimized to a 40px strip — same pattern as
     the other two maps on this page. -->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/county_collections.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Public Sans', system-ui, -apple-system, sans-serif; color: #1A1A19; background: #F3F0EA; }

  .otc-layout { display: flex; align-items: stretch; height: 100vh; }
  .otc-map { flex: 1 1 auto; min-width: 0; position: relative; }
  #map { position: absolute; inset: 0; background: #eaeef2; }

  /* summary chip shown on the map ONLY while the panel is minimized */
  .otc-chip { position: absolute; right: 14px; top: 12px; z-index: 500; background: rgba(255,255,255,0.94); border: 1px solid #D8D3CA; border-radius: 100px; padding: 7px 14px; font-size: 13px; color: #33302B; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: none; }
  .otc-layout.is-min .otc-chip { display: block; }

  /* ---- docked panel ---- */
  .otc-panel { flex: 0 0 290px; background: #fff; border-left: 1px solid #E5E2DC; display: flex; flex-direction: column; min-height: 0; }
  .otc-layout.is-min .otc-panel { display: none; }
  .otc-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid #EFECE6; }
  .otc-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: #9A968D; margin: 0; }
  .otc-minbtn { border: 1px solid #D8D3CA; background: #fff; border-radius: 6px; width: 26px; height: 24px; cursor: pointer; color: #56534D; font-size: 13px; line-height: 1; padding: 0; }
  .otc-minbtn:hover { background: #F4F1EB; }
  .otc-body { padding: 12px 16px 14px; overflow-y: auto; flex: 1; }

  /* tax-type switcher */
  .otc-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .otc-switch button { border: 1px solid #D8D3CA; background: #fff; border-radius: 7px; padding: 8px 4px; font-family: inherit; font-size: 12px; font-weight: 600; color: #56534D; cursor: pointer; }
  .otc-switch button.active { color: #fff; border-color: transparent; background: #BB0000; }

  .otc-pc { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #56534D; margin: 2px 0 14px; cursor: pointer; }
  .otc-pc input { accent-color: #BB0000; cursor: pointer; }

  /* readout */
  .otc-readout { border-top: 1px solid #EFECE6; padding-top: 12px; }
  .otc-readout .name { font-family: 'Source Serif 4', serif; font-size: 16.5px; font-weight: 600; color: #33302B; margin: 0 0 4px; }
  .otc-readout .value { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 600; color: #33302B; }
  .otc-readout .sub { font-size: 12px; color: #9A968D; margin-top: 3px; }

  /* legend (docked at the bottom of the panel, not floating on the map) */
  #legend { border-top: 1px solid #EFECE6; margin-top: 12px; padding-top: 11px; font-size: 12.5px; }
  #legend .lt { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: #9A968D; margin-bottom: 8px; }
  .lrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: #56534D; }
  .lrow i { display: inline-block; width: 16px; height: 11px; border-radius: 3px; flex: 0 0 auto; }

  /* scope note */
  .otc-note { border-top: 1px solid #EFECE6; margin-top: 12px; padding-top: 10px; font-size: 12px; line-height: 1.5; color: #8A8880; }

  .leaflet-interactive { cursor: crosshair; }

  /* minimized strip */
  .otc-strip { flex: 0 0 40px; border: 0; border-left: 1px solid #E5E2DC; background: #fff; cursor: pointer; display: none; flex-direction: column; align-items: center; padding: 12px 0; gap: 14px; font-family: inherit; }
  .otc-strip:hover { background: #F4F1EB; }
  .otc-strip .arrow { font-size: 13px; color: #56534D; }
  .otc-strip .vlabel { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: #9A968D; writing-mode: vertical-rl; }
  .otc-layout.is-min .otc-strip { display: flex; }

  /* ---- narrow screens: panel docks BELOW the map ---- */
  @media (max-width: 719px) {
    .otc-layout { flex-direction: column; }
    .otc-map { flex: 1 1 auto; min-height: 45%; }
    .otc-panel { flex: 0 0 auto; max-height: 55%; border-left: 0; border-top: 1px solid #E5E2DC; }
    .otc-minbtn, .otc-strip, .otc-chip { display: none !important; } /* no minimize needed when stacked */
  }
</style>
</head>
<body>
<div class="otc-layout" id="otc-layout">

  <div class="otc-map">
    <div id="map"></div>
    <div class="otc-chip" id="otc-chip">Property tax</div>
  </div>

  <aside class="otc-panel" aria-label="Local tax collections">
    <div class="otc-panel-head">
      <p class="otc-kicker">Local tax collections</p>
      <button class="otc-minbtn" id="otc-min" title="Minimize panel" aria-label="Minimize panel">&raquo;</button>
    </div>
    <div class="otc-body" id="panel">
      <div class="otc-switch" id="taxswitch">
        <button data-v="property" class="active">Property</button>
        <button data-v="sales">Sales</button>
        <button data-v="muni_income">Muni income</button>
      </div>
      <label class="otc-pc"><input type="checkbox" id="pc"> Per resident</label>

      <div class="otc-readout">
        <div class="name" id="p-name">Hover a county</div>
        <div class="value" id="p-value">&nbsp;</div>
        <div class="sub" id="p-sub">&nbsp;</div>
      </div>

      <div id="legend">
        <div class="lt" id="lg-title"></div>
        <div id="lg-rows"></div>
      </div>

      <div class="otc-note" id="scope"></div>
    </div>
  </aside>

  <button class="otc-strip" id="otc-strip" title="Show panel" aria-label="Show panel">
    <span class="arrow">&laquo;</span>
    <span class="vlabel">Local tax collections</span>
  </button>
</div>

<script>
const map = L.map('map',{minZoom:6,maxZoom:12}).setView([40.2,-82.7],7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd'}).addTo(map);

const PALETTE = ["#ffffcc","#c7e9b4","#7fcdbb","#41b6c4","#2c7fb8","#253494"];
const LABEL = {property:"Real property tax charged", sales:"County sales/use tax collected", muni_income:"Municipal income tax"};
const SHORT = {property:"Property tax", sales:"Sales tax", muni_income:"Muni income tax"};
const META = window.OH_COLLECTIONS_META || {};

// Each layer is a defensible subset of its tax, not the whole thing. Say which subset, and how big
// the excluded piece is, so a reader who sums the counties knows why the total is short of the
// statewide figure quoted in the newsletter.
const bn = v => "$" + (v/1e9).toFixed(2) + "B";
function scopeNote(){
  let h = "";
  if (field === "property" && META.property_total)
    h = "Shows <b>real</b> property only (" + bn(META.property_total) + "), the amendment's target. "
      + "Excludes the public-utility tangible personal property tax, a separate instrument worth "
      + bn(META.put_excluded) + " statewide.";
  if (field === "sales" && META.sales_total)
    h = "Shows the <b>county</b> permissive tax only (" + bn(META.sales_total) + "). Ohio's 11 regional "
      + "transit authorities levy a further " + bn(META.transit_excluded) + "; their districts cross "
      + "county lines, so they can't be mapped to one county.";
  document.getElementById('scope').innerHTML = h;
}
let field = "property", perCap = false, breaks = [];

const val = p => { const v = p[field]; return perCap ? (p.population ? v/p.population : 0) : v; };
function fmt(v){
  if (perCap) return "$" + Math.round(v).toLocaleString();
  if (v >= 1e9) return "$" + (v/1e9).toFixed(2) + "B";
  if (v >= 1e6) return "$" + Math.round(v/1e6) + "M";
  return "$" + Math.round(v).toLocaleString();
}
function computeBreaks(){
  const vals = OH_COUNTY_COLLECTIONS.features.map(f => val(f.properties)).filter(v=>v>0).sort((a,b)=>a-b);
  breaks = [1,2,3,4,5].map(i => vals[Math.floor(i/6*vals.length)]);   // 5 cut points -> 6 bins
}
function colorFor(v){
  if (!(v>0)) return "#eeeeee";
  let i=0; while (i<breaks.length && v>breaks[i]) i++; return PALETTE[i];
}
const style = f => ({fillColor: colorFor(val(f.properties)), weight:0.6, color:"#fff", fillOpacity:0.85});

let layer;
function draw(){
  computeBreaks();
  if (layer) layer.remove();
  layer = L.geoJSON(OH_COUNTY_COLLECTIONS, {
    style,
    onEachFeature: (f,l) => {
      l.on('mouseover', e => { e.target.setStyle({weight:2,color:'#333'}); e.target.bringToFront(); show(f.properties); });
      l.on('mouseout',  e => { e.target.setStyle({weight:0.6,color:'#fff'}); });
    }
  }).addTo(map);

  document.querySelectorAll('#taxswitch button').forEach(b => b.classList.toggle('active', b.dataset.v === field));
  document.getElementById('p-name').textContent = 'Hover a county';
  document.getElementById('p-value').innerHTML = '&nbsp;';
  document.getElementById('p-sub').innerHTML = '&nbsp;';
  document.getElementById('otc-chip').textContent = SHORT[field];

  legend();
  scopeNote();
}
function show(p){
  document.getElementById('p-name').textContent = p.county + ' County';
  document.getElementById('p-value').textContent = fmt(val(p));
  document.getElementById('p-sub').textContent = LABEL[field] + (perCap ? ' · per resident' : '');
  document.getElementById('otc-chip').textContent = p.county + ' · ' + fmt(val(p));
}
function legend(){
  document.getElementById('lg-title').textContent = LABEL[field] + (perCap ? ' / resident' : '');
  const lo = [0,...breaks];
  let rows = '';
  for (let i=0;i<PALETTE.length;i++){
    const a = lo[i], b = breaks[i];
    rows += `<div class="lrow"><i style="background:${PALETTE[i]}"></i><span>${fmt(a)}${b!==undefined ? ' – ' + fmt(b) : '+'}</span></div>`;
  }
  document.getElementById('lg-rows').innerHTML = rows;
}

document.querySelectorAll('#taxswitch button').forEach(b => b.addEventListener('click', () => { field = b.dataset.v; draw(); }));
document.getElementById('pc').addEventListener('change', e => { perCap = e.target.checked; draw(); });
draw();

// minimize toggle: collapse the panel to a 40px strip, then let Leaflet reflow
const layout = document.getElementById('otc-layout');
function togglePanel(){
  layout.classList.toggle('is-min');
  setTimeout(() => map.invalidateSize(), 50);
}
document.getElementById('otc-min').addEventListener('click', togglePanel);
document.getElementById('otc-strip').addEventListener('click', togglePanel);
</script>
</body>
</html>
